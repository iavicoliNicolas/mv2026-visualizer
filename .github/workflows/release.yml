name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:

jobs:
  build:
    if: github.event_name == 'pull_request'
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis,msi
          - platform: ubuntu-22.04
            bundles: appimage,deb
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the VM engine
        run: npm test

      - name: Build bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

  release:
    if: github.event_name != 'pull_request'
    name: Draft release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Test the VM engine
        run: npm test

      - name: Build and publish a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && 'v__VERSION__' || github.ref_name }}
          releaseName: MV2026 Visualizer ${{ github.event_name == 'workflow_dispatch' && 'v__VERSION__' || github.ref_name }}
          releaseBody: |
            Borrador de MV2026 Visualizer.
            Windows: instalador NSIS (.exe) y MSI.
            Linux: AppImage y paquete .deb.
            Los binarios no están firmados.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
